<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTAALAM - AQRB Exam Prep</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:white;min-height:100vh;padding:0 16px 16px}
.top{position:sticky;top:0;background:#0f172a;padding:16px 0 12px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{font-weight:900;font-size:24px;letter-spacing:1px}
.logo span{color:#f59e0b}
.badge{background:#f59e0b;color:#111;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800}
.card{background:white;color:#111;border-radius:20px;padding:18px;margin-top:12px}
.card h1{font-size:28px;line-height:1.15}
.card p{color:#64748b;margin-top:8px;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.prof{border:2px solid #e2e8f0;border-radius:16px;padding:14px;text-align:center;cursor:pointer;background:#f8fafc}
.prof.active{border-color:#f59e0b;background:#fffbeb;box-shadow:0 0 0 2px #f59e0b}
.prof b{display:block;font-size:14px;line-height:1.2}
.prof small{color:#64748b}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border-radius:14px;padding:14px;border:0;font-weight:800;cursor:pointer;font-size:14px;line-height:1.3}
.btn-gold{background:#f59e0b;color:#111}
.btn-dark{background:#0f172a;color:white}
.btn-white{background:white;border:2px solid #e2e8f0;color:#111}
.hidden{display:none!important}
.q-top{display:flex;justify-content:space-between;font-size:13px;color:#64748b;font-weight:700}
.q{font-size:19px;line-height:1.4;margin:14px 0;font-weight:800;color:#111}
.opt{border:2px solid #e2e8f0;border-radius:14px;padding:13px;margin-top:10px;cursor:pointer;font-size:15px;background:#f8fafc;color:#111}
.opt.correct{border-color:#16a34a;background:#dcfce7}
.opt.wrong{border-color:#dc2626;background:#fee2e2}
.explain{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.5;color:#111}
input,select{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:12px;margin-top:8px;font-size:15px}
.progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:#f59e0b;width:5%}
.score{font-size:42px;font-weight:900;text-align:center;margin:16px 0;color:#111}
.center{text-align:center}
.small{font-size:13px;color:#64748b}
.auth-box{background:#1e293b;border-radius:16px;padding:14px;margin-top:12px}
.auth-box b{color:white}
.auth-box p{color:#94a3b8}
.pay-opt{border:2px solid #e2e8f0;border-radius:14px;padding:12px;margin-top:10px;cursor:pointer;background:#f8fafc;display:flex;justify-content:space-between;align-items:center}
.pay-opt.active{border-color:#f59e0b;background:#fffbeb}
.law-card{background:white;color:#111;border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;border:2px solid #e2e8f0}
.law-card:active{border-color:#f59e0b;background:#fffbeb}
</style>
</head>
<body>
<div class="top"><div class="logo">MTA<span>ALAM</span></div><div class="badge">AQRB EXAM PREP</div></div>
<div id="authCard" class="auth-box">
<b id="authTitle">👤 Ingia / Jisajili</b>
<p id="authDesc">Ingia ili Log Book yako ihifadhiwe kwako peke yako.</p>
<input id="authEmail" type="email" placeholder="
